name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore RTSC-Core.slnx
      - name: Build
        run: dotnet build RTSC-Core.slnx -c Release --no-restore
      - name: Test
        run: dotnet test RTSC.Core.Tests/RTSC.Core.Tests.csproj -c Release --no-build --no-restore
      - name: Dependency audit
        run: dotnet package list --project RTSC-Core.slnx --vulnerable --include-transitive --no-restore
