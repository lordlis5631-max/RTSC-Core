name: Docker E2E and GHCR

on:
  pull_request:
    paths:
      - 'RTSC.Core/**'
      - 'db/**'
      - 'compose.yml'
      - 'scripts/**'
      - '.github/workflows/docker-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'RTSC.Core/**'
      - 'db/**'
      - 'compose.yml'
      - 'scripts/**'
      - '.github/workflows/docker-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_EMAIL=admin-${GITHUB_RUN_ID}@ci.local" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 24)Aa1!" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_NAME=CI Admin" >> "$GITHUB_ENV"
          echo "E2E_EMAIL=e2e-${GITHUB_RUN_ID}@ci.local" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$(openssl rand -hex 24)Aa1!" >> "$GITHUB_ENV"
          echo "ASPNETCORE_ENVIRONMENT=Development" >> "$GITHUB_ENV"

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build and start application
        run: docker compose up -d --build

      - name: Wait for readiness
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then
              echo "Application is ready"
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready" >&2
          docker compose ps >&2
          docker compose logs --no-color >&2
          exit 1

      - name: Public smoke checks
        run: bash scripts/smoke.sh

      - name: Auth and database E2E
        run: bash scripts/e2e-auth.sh

      - name: Show container state
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop test stack
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build release image
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/rtsc-core"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA}" \
            ./RTSC.Core

      - name: Publish release image
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/rtsc-core"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
